name: Sync upstream

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  rebase:
    if: github.repository == 'Mcrich23/swift-docc-plugin'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_FORK_TOKEN || github.token }}
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Rebase onto upstream main
        id: rebase
        run: bash VaporDocumentation/Scripts/rebase-upstream.sh prepare
      - name: Validate upstream and Vapor functionality
        run: bash VaporDocumentation/Scripts/test.sh
      - name: Publish tested main
        env:
          ORIGINAL_HEAD: ${{ steps.rebase.outputs.original_head }}
          UPSTREAM_HEAD: ${{ steps.rebase.outputs.upstream_head }}
        run: bash VaporDocumentation/Scripts/rebase-upstream.sh publish
